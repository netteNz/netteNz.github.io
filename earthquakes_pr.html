<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive visualization of earthquake data in Puerto Rico using PyScript and Folium">
    <meta name="keywords" content="earthquake visualization, data visualization, folium, pyscript, interactive map">
    <title>Earthquake Visualization — nettenzOS</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0L5LLER0MH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-0L5LLER0MH');
    </script>

    <!-- Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:wght,CASL,MONO@300..800,0..1,0..1&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Shared design tokens (palette, type, motion) -->
    <link rel="stylesheet" href="./assets/css/main.css?v=3">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-ui);
            background: var(--console);
        }

        /* This page's menu bar has three groups; keep them packed left with the clock pushed right */
        .menu-bar { justify-content: flex-start; gap: 0; }

        /* Wallpaper sits behind everything */
        .page-wallpaper {
            position: fixed;
            inset: 0;
            top: 32px;
            background: var(--console);
            z-index: 0;
        }

        /* Map fills everything below the 32px menu bar */
        #map-area {
            position: fixed;
            top: 32px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }

        /* PyScript auto-inserts a wrapper; force it to fill */
        .pyscript {
            width: 100% !important;
            height: 100% !important;
            display: flex !important;
            flex-direction: column !important;
        }

        #folium {
            width: 100% !important;
            height: 100% !important;
            flex: 1 1 auto !important;
        }

        .leaflet-container {
            width: 100% !important;
            height: 100% !important;
        }

        /* ─── Legend panel (dock / glass aesthetic) ─── */
        .eq-legend {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
        }

        .eq-legend-inner {
            background: var(--panel-raised);
            border: 1px solid var(--rule);
            border-radius: var(--radius-window);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            padding: 14px 18px;
            min-width: 168px;
        }

        .eq-legend-title {
            font-size: var(--fs-14);
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--rule);
        }

        .eq-legend-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .eq-legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: var(--fs-12);
            color: var(--ink-muted);
            font-variant-numeric: tabular-nums;
        }

        .eq-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Magnitude severity scale (Catppuccin green, yellow, peach, red). Reuses the
           meter colours, which encode the same "safe to peak" idea; peach is page-local. */
        .eq-dot-minor    { background: var(--meter-safe); }
        .eq-dot-light    { background: var(--meter-mid); }
        .eq-dot-moderate { background: #fab387; }
        .eq-dot-strong   { background: var(--meter-peak); }

        /* ─── Loading dialog ─── */
        #loading {
            outline: none;
            border: none;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--ink);
        }

        #loading::backdrop { background: rgba(16, 26, 44, 0.6); }

        .spinner {
            width: 40px;
            height: 40px;
            margin-bottom: 1.25rem;
            border: 3px solid var(--rule);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: eq-spin 1s linear infinite;
        }

        .loading-text { font-size: var(--fs-16); color: var(--ink-muted); }

        @keyframes eq-spin { to { transform: rotate(360deg); } }

        /* Back nav pill inside menu bar */
        .nav-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: var(--fs-14);
            color: var(--ink-muted);
            text-decoration: none;
            padding: 2px 8px;
            border-radius: var(--radius-control);
            transition:
                color var(--dur-2) var(--ease-standard),
                background var(--dur-2) var(--ease-standard);
        }

        .nav-back-btn:hover {
            color: var(--ink);
            background: var(--ink-hover);
        }

        .nav-page-label {
            font-size: var(--fs-14);
            font-weight: 500;
            color: var(--ink);
        }
    </style>
</head>

<body>
    <!-- ─── macOS Menu Bar ─── -->
    <div class="menu-bar fixed top-0 left-0 right-0 h-8 backdrop-blur-md z-50 flex items-center px-4">
        <div class="flex items-center space-x-2 sm:space-x-3 truncate">
            <span class="menu-brand hidden sm:inline">nettenzOS</span>
            <span class="t-muted hidden sm:inline" aria-hidden="true">›</span>
            <span class="nav-page-label truncate">earthquakes-pr</span>
        </div>

        <div class="flex items-center space-x-2 ml-4 sm:ml-6">
            <a href="index.html" class="nav-back-btn">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                <span class="hidden sm:inline">Home</span>
            </a>
        </div>

        <div class="ml-auto flex items-center space-x-2 sm:space-x-3 text-white text-sm">
            <div class="level-meter" aria-hidden="true"><span class="is-lit"></span><span class="is-lit"></span><span class="is-lit"></span><span></span><span></span><span></span><span></span><span></span></div>
            <span id="current-time" class="menu-clock"></span>
        </div>
    </div>

    <!-- ─── Ambient wallpaper (behind map) ─── -->
    <div class="page-wallpaper" aria-hidden="true"></div>

    <!-- ─── Map area ─── -->
    <div id="map-area">
        <!-- Loading dialog -->
        <dialog id="loading">
            <div class="flex flex-col items-center justify-center p-8">
                <div class="spinner"></div>
                <div class="loading-text">Loading visualization...</div>
            </div>
        </dialog>

        <!-- Folium renders into this -->
        <div id="folium"></div>
    </div>

    <!-- ─── Magnitude legend ─── -->
    <div class="eq-legend">
        <div class="eq-legend-inner">
            <div class="eq-legend-title">Magnitude</div>
            <div class="eq-legend-items">
                <div class="eq-legend-item">
                    <span class="eq-dot eq-dot-minor"></span>
                    <span>&lt; 3.0</span>
                </div>
                <div class="eq-legend-item">
                    <span class="eq-dot eq-dot-light"></span>
                    <span>3.0 – 3.9</span>
                </div>
                <div class="eq-legend-item">
                    <span class="eq-dot eq-dot-moderate"></span>
                    <span>4.0 – 4.9</span>
                </div>
                <div class="eq-legend-item">
                    <span class="eq-dot eq-dot-strong"></span>
                    <span>5.0+</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PyScript -->
    <script type="py" src="./projects/earthquake-map/main.py" config="./pyscript.toml"></script>

    <script>
        // Live clock matching index.html
        function updateTime() {
            const el = document.getElementById('current-time');
            if (el) {
                el.textContent = new Date().toLocaleTimeString('en-US', {
                    hour: 'numeric', minute: '2-digit', hour12: true
                });
            }
        }
        updateTime();
        setInterval(updateTime, 1000);

        // Loading dialog management
        const loading = document.getElementById('loading');

        document.addEventListener('DOMContentLoaded', () => {
            loading.showModal();
        });

        document.addEventListener('map:loaded', () => {
            setTimeout(() => { if (loading.open) loading.close(); }, 500);
        });

        // 20s hard timeout
        setTimeout(() => { if (loading.open) loading.close(); }, 20000);

        // Poll for Leaflet tiles
        const checkMapInterval = setInterval(() => {
            if (document.querySelector('.leaflet-container') &&
                document.querySelector('.leaflet-tile-loaded')) {
                if (loading.open) {
                    loading.close();
                    clearInterval(checkMapInterval);
                }
            }
        }, 1000);

        // MutationObserver fallback
        const foliumEl = document.getElementById('folium');
        if (foliumEl) {
            const obs = new MutationObserver(() => {
                if (document.querySelector('.leaflet-container')) {
                    setTimeout(() => { if (loading.open) loading.close(); obs.disconnect(); }, 1000);
                }
            });
            obs.observe(foliumEl, { childList: true, subtree: true });
        }
    </script>
</body>

</html>
