            <section>
                <h2>About</h2>
                <p>B.S. in Computer Engineering, cybersecurity specialization (2024). Writing code since 2017. I design and build agentic AI systems in Python, FastAPI and React. Outside work: Raspberry Pi and RP2040 hardware, reinforcement learning for trading, a home lab with MCP servers, and audio software.</p>

                <ul>
                    <li><a href="https://github.com/netteNz/oled-bonnet">OLED system HUD</a>: a system-monitor display for a Raspberry Pi, built on a partial-update OLED driver.</li>
                    <li><a href="https://github.com/netteNz/trading-dashboard">Trading dashboard</a>: a self-hosted charting dashboard with a custom indicator engine and live streaming.</li>
                    <li><a href="https://github.com/netteNz/reinforcement-learning-stocks">RL trading bot</a>: reinforcement learning agent for stock trading, trained with PPO (stable-baselines3) in a custom Gymnasium environment.</li>
                    <li><a href="https://github.com/netteNz/macropad-profiles">MacroPad firmware</a>: CircuitPython firmware giving an RP2040 macro pad per-app key profiles and an OLED UI.</li>
                    <li><a href="https://nettenz.github.io/web-audio-app">Web audio player</a>: real-time audio visualizer built on the Web Audio API, with LUFS loudness metering and a live frequency spectrum.</li>
                    <li><a href="https://nettenz.github.io/earthquakes_pr.html">Earthquake visualization</a>: interactive map of Puerto Rico earthquake data, rendered in the browser with Python through PyScript.</li>
                    <li><a href="https://nettenz.github.io/veto-tsd/">Veto system</a>: team decision-making tool where members vote on options and can veto them.</li>
                </ul>
            </section>
